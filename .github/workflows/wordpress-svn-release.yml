name: Build and release to WordPress.org

on:
  push:
    tags:
      - "v*"
  # Re-run a failed deploy from a branch that has the fix - see
  # https://github.com/palasthotel/github-workflows/blob/main/docs/wp-plugin.md
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy, without the leading v (e.g. 1.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-svn-deploy.yml@v1
    with:
      slug: a-little-more-secure
      version: ${{ github.event.inputs.version }}
      # composer in the pack step has to satisfy public/composer.json's php ~8.2
      php-version: "8.2"
    secrets: inherit
