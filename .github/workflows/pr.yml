name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: a-little-more-secure
      dev-plugin-name: A little more secure - DEV
      # public/composer.json requires php ~8.2 and the header says Requires PHP: 8.2
      php-versions: '["8.2", "8.3", "8.4"]'
      php-version: "8.2"
      required-files: |
        vendor/autoload.php
        languages/a-little-more-secure.pot
        languages/a-little-more-secure-de_DE.mo
